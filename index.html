
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <link rel="icon" type="image/png" href="favcon.png">
<link rel="apple-touch-icon" href="favcon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="google-site-verification" content="GJgiGcjUJr2xIs5jYI0a8oOZw12W3oNBlBu8nTtl5Pw">

  <meta name="description" content="املاک هدایتی تبریز؛ خرید، فروش و اجاره ملک با خیال راحت">

  <title>املاک هدایتی | تبریز</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101b2d;
      color: #d8b56d;
      text-align: center;
      font-family: sans-serif;
    }

    header {
      padding: 35px 15px 20px;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 30px;
    }

    .banner {
      display: block;
      width: calc(100% - 20px);
      max-width: 1400px;
      height: clamp(300px, 60vw, 700px);
      object-fit: contain;
      border-radius: 18px;
      border: 1px solid #d8b56d;
      margin: 10px auto 30px;
    }

    .welcome {
      color: white;
      padding: 0 15px 30px;
      line-height: 2;
    }

    .slogan {
      color: #d8b56d;
      font-size: 21px;
      font-weight: bold;
      line-height: 2;
    }

    footer {
      padding: 25px 10px;
      margin-top: 30px;
      color: #d8b56d;
      border-top: 1px solid #d8b56d;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>املاک هدایتی</h1>
  </header>

  <img
    class="banner"
    src="IMG_20261025_154346_409.jpg"
    alt="بنر املاک هدایتی تبریز"
  >

  <section class="welcome">
    <p>به وب‌سایت ما خوش آمدید</p>
    <p>خانه‌ای برای آینده‌ای بهتر</p>

    <p class="slogan">
      ملک می‌خوای؟ بیا هدایتی<br>
      چون با خیال راحت هدایتی
    </p>
  </section>

  <footer>
    ساخته‌شده توسط محمدجواد هدایتی
  </footer>

</body>
</html>
